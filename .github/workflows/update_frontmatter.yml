name: Update Frontmatter Dates

on:
  push:
    branches:
      - main
    paths:
      - 'source/**/*.md'

jobs:
  update-dates:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
      
      - name: Update frontmatter dates
        run: python .github/scripts/update_frontmatter_dates.py
      
      - name: Push changes
        if: success()
        run: |
          # Check if there are new commits to push
          if git diff HEAD origin/$(git branch --show-current) --quiet 2>/dev/null; then
            echo "No new commits to push"
          else
            echo "Pushing changes..."
            git push
          fi
